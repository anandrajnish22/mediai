services:
  # 1. Node.js Backend Service
  - type: web
    name: mediai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      # Render will automatically generate a secure random string for JWT
      - key: JWT_SECRET
        generateValue: true
      # You MUST paste your MongoDB Atlas connection string in the Render Dashboard
      - key: MONGODB_URI
        sync: false
      # You MUST update this with your final Vercel Frontend URL later
      - key: FRONTEND_URL
        sync: false
      # This connects the Node backend to the AI Service automatically
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: mediai-ai-service
          envVarKey: RENDER_EXTERNAL_URL

  # 2. Python AI Service
  - type: web
    name: mediai-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --log-file -
    envVars:
      - key: PORT
        value: 5001
      - key: PYTHON_VERSION
        value: 3.9.0
